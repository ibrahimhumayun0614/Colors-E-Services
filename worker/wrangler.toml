name = "ccs-invoice-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"

[[d1_databases]]
binding = "DB"
database_name = "ccs-invoice-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[vars]
# Set API_SECRET via: wrangler secret put API_SECRET
ALLOWED_ORIGINS = "https://ccs-invoice.pages.dev,http://localhost:5173"
